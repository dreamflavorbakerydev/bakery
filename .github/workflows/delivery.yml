name: Bakery CI and delivery

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Django tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: bakery_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d bakery_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      # Disposable runner-local database; never use a Neon/production URL here.
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/bakery_ci
      DJANGO_DEBUG: '1'
      DJANGO_SECRET_KEY: disposable-ci-key-not-used-by-deployments
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tools/tests -v
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test bakery --noinput
      - run: python manage.py collectstatic --noinput

  preview:
    name: Isolated preview
    needs: test
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      vars.CICD_PREVIEWS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PREVIEW_PROJECT_ID }}
      VERCEL_PRODUCTION_PROJECT_ID: ${{ vars.VERCEL_PRODUCTION_PROJECT_ID }}
      NEON_PREVIEW_PROJECT_ID: ${{ vars.NEON_PREVIEW_PROJECT_ID }}
      NEON_PRODUCTION_PROJECT_ID: ${{ vars.NEON_PRODUCTION_PROJECT_ID }}
      NEON_PREVIEW_PARENT_BRANCH_ID: ${{ vars.NEON_PREVIEW_PARENT_BRANCH_ID }}
      NEON_DATABASE: ${{ vars.NEON_DATABASE }}
      NEON_ROLE: ${{ vars.NEON_ROLE }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_PREVIEW_TOKEN }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_PREVIEW_SECRET_KEY }}
      DJANGO_DEBUG: '0'
    steps:
      # Same PR merge commit tested above. Never use pull_request_target here.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python tools/delivery.py preflight-preview
      - run: python -m pip install -r requirements.txt
      - name: Install pinned deployment CLI outside the checkout
        run: |
          npm install --prefix "$RUNNER_TEMP/vercel-cli" --no-package-lock --no-audit --no-fund vercel@65.8.0
          echo "$RUNNER_TEMP/vercel-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Create a new isolated branch (no reset or deletion)
        id: neon
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # v6
        with:
          api_key: ${{ secrets.NEON_PREVIEW_API_KEY }}
          project_id: ${{ vars.NEON_PREVIEW_PROJECT_ID }}
          parent_branch: ${{ vars.NEON_PREVIEW_PARENT_BRANCH_ID }}
          branch_name: preview/pr-${{ github.event.pull_request.number }}/run-${{ github.run_id }}-${{ github.run_attempt }}
          database: ${{ vars.NEON_DATABASE }}
          role: ${{ vars.NEON_ROLE }}
          ssl: require
          suspend_timeout: '300'
      - name: Migrate only the preview branch
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
          PREVIEW_BRANCH_ID: ${{ steps.neon.outputs.branch_id }}
          PREVIEW_BRANCH_CREATED: ${{ steps.neon.outputs.created }}
        run: python tools/delivery.py migrate-preview
      - name: Build and deploy preview with the branch's pooled URL
        id: deploy
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
        run: python tools/delivery.py deploy-preview
      - name: Verify login and static assets over HTTPS
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_PREVIEW_BYPASS_SECRET }}
        run: python tools/delivery.py smoke

  production:
    name: Approved production release
    needs: test
    # Deliberately inactive until the owner approves and sets this repository variable.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.CICD_PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.stage.outputs.url }}
    concurrency:
      group: bakery-production
      # Never interrupt an in-flight migration/release.
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PRODUCTION_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_PRODUCTION_TOKEN }}
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      DATABASE_URL_DIRECT: ${{ secrets.PRODUCTION_DATABASE_URL_DIRECT }}
      PRODUCTION_DATABASE_HOST: ${{ vars.PRODUCTION_DATABASE_HOST }}
      PRODUCTION_DATABASE_NAME: ${{ vars.PRODUCTION_DATABASE_NAME }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_PRODUCTION_SECRET_KEY }}
      DJANGO_DEBUG: '0'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Refuse obsolete release commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$current" = "$GITHUB_SHA"
      - run: python tools/delivery.py preflight-production
      - run: python -m pip install -r requirements.txt
      - name: Install pinned deployment CLI outside the checkout
        run: |
          npm install --prefix "$RUNNER_TEMP/vercel-cli" --no-package-lock --no-audit --no-fund vercel@65.8.0
          echo "$RUNNER_TEMP/vercel-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Build production candidate without assigning production domains
        id: stage
        run: python tools/delivery.py stage-production
      - name: Apply additive production migrations under a database lock
        env:
          ALLOW_PRODUCTION_MIGRATIONS: approved
        run: python tools/delivery.py migrate-production
      - name: Verify candidate before promotion
        env:
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_PRODUCTION_BYPASS_SECRET }}
        run: python tools/delivery.py smoke
      - name: Promote the tested candidate
        env:
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        run: python tools/delivery.py promote-production
