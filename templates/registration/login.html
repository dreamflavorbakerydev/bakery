{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Welcome · Bakery</title><link rel="icon" type="image/png" href="{% static 'bakery/favicon.png' %}?v=2"><link rel="stylesheet" href="{% static 'bakery/app.css' %}"></head><body class="login-page"><main class="login-card"><a class="brand login-brand" href="{% url 'login' %}"><img class="brand-icon" src="{% static 'bakery/logo.png' %}" alt="" width="43" height="43"><span>bakery</span></a><span class="eyebrow">A BETTER DAY, BAKED IN.</span><h1>Welcome back.</h1><p class="muted">Sign in to your bakery workspace.</p><form method="post">{% csrf_token %}{{ form.as_p }}{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}<button class="button primary" type="submit">Sign in →</button></form><p class="login-help">Need an account? Contact your bakery office.</p></main></body></html>
